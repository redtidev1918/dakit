name: Release

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      version: {description: "Existing dakit_cli version; blank reads the manifest", required: false, type: string}
      dry_run: {description: "Build and validate without publishing", required: false, default: false, type: boolean}
      force: {description: "Rerun a healthy version", required: false, default: false, type: boolean}
      repair: {description: "Repair the current incomplete version", required: false, default: false, type: boolean}
      stage: {description: "Recovery stage label", required: false, default: all, type: string}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Central workflow emits Release Please component paths for this OIDC publisher.
  release:
    uses: redtidev1918/release-infra/.github/workflows/reusable-release.yml@v1
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run || false }}
      force: ${{ github.event_name == 'pull_request' || inputs.force || false }}
      repair: ${{ github.event_name == 'pull_request' || inputs.repair || false }}
      stage: ${{ inputs.stage || 'all' }}
    secrets: inherit

  publish-pub:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.paths_released != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
      - name: Publish released packages with OIDC
        run: |
          set -euo pipefail
          for package in packages/dakit_core packages/dakit_api packages/dakit_flutter; do
            if [[ "$PATHS_RELEASED" =~ (\"|\[|,)\"?${package//\//\\/}\"?(\"|\]|,) ]]; then
              cd "$package"
              dart pub get
              dart pub publish --dry-run
              dart pub publish -f
              cd - >/dev/null
            fi
          done
