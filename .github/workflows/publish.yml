name: Publish to pub.dev

# Publishes the three public DAKit packages to pub.dev when a matching
# version tag is pushed. Authentication uses pub.dev's GitHub Actions OIDC
# integration (no long-lived token/secret), so automated publishing must be
# enabled once per package in the pub.dev web UI:
#
#   pub.dev/packages/<package>/admin  ->  Automated publishing
#     repository:  redtidev1918/dakit
#     tag pattern: <package>-v{{version}}
#
# One-time prerequisites (per package): the package must already be published
# at least once, and the tag's version must match `version:` in its pubspec.
# Dependency order matters: publish dakit_core, then dakit_api, then
# dakit_flutter, e.g.:
#
#   git tag dakit_core-v0.2.0    && git push origin dakit_core-v0.2.0
#   git tag dakit_api-v0.2.0     && git push origin dakit_api-v0.2.0
#   git tag dakit_flutter-v0.2.0 && git push origin dakit_flutter-v0.2.0
#
# Each version on pub.dev is immutable, so only tag versions that have not
# been published before.

on:
  push:
    tags:
      - 'dakit_core-v[0-9]+.[0-9]+.[0-9]+'
      - 'dakit_api-v[0-9]+.[0-9]+.[0-9]+'
      - 'dakit_flutter-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: read

jobs:
  dakit_core:
    if: startsWith(github.ref, 'refs/tags/dakit_core-v')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dakit_core

  dakit_api:
    if: startsWith(github.ref, 'refs/tags/dakit_api-v')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dakit_api

  dakit_flutter:
    if: startsWith(github.ref, 'refs/tags/dakit_flutter-v')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dakit_flutter
