name: Bug report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which DAKit package is affected?
      placeholder: e.g. dakit_api 0.1.6
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps that trigger the bug.
      render: dart
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste any relevant (redacted) diagnostic events or stack traces.
      render: shell
